name: Security Guard

on:
  pull_request:
  push:
    branches:
      - development
      - main

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security dependency guard
        run: ./scripts/security_dependency_guard.sh

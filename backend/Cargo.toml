[package]
name = "bctn-backend"
version = "1.1.1"
edition = "2024"

[[bin]]
name = "bctn"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.95"
argon2 = "0.5.3"
axum = { version = "0.7.9", features = ["macros", "json"] }
axum-extra = { version = "0.9.6", features = ["cookie"] }
clap = { version = "4.5.27", features = ["derive", "env"] }
dotenvy = "0.15.7"
hex = "0.4.3"
rand = "0.8.5"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.8"
sqlx = { version = "0.8.3", features = ["macros", "migrate", "runtime-tokio-rustls", "sqlite"] }
time = { version = "0.3.37", features = ["formatting"] }
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.2", features = ["fs", "trace", "set-header"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.10.1"
tower = { version = "0.5.2", features = ["util"] }

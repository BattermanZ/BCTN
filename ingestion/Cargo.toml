[package]
name = "bctn-ingest"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.27", features = ["derive"] }
csv = "1.3.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
unicode-normalization = "0.1.24"
